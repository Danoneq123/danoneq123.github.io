<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025/2026</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Lato", sans-serif;
    background:url("hallowen.gif") no-repeat center center fixed;
    background-size:cover;
    overflow:hidden;
}

/* mgła */
body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
}

/* panel */
.container{
    position:relative;
    background:rgba(0,0,0,0.75);
    padding:40px;
    border-radius:15px;
    text-align:center;
    backdrop-filter:blur(8px);
    box-shadow:0 0 30px rgba(0,0,0,0.7);
    z-index:2;
}

/* zegar */
#clock{
    color:#ff6b6b;
    font-size:28px;
    margin-bottom:25px;
    letter-spacing:3px;
}

/* przyciski */
a{
    display:block;
    text-decoration:none;
    color:white;
    background:#ff3b3b;
    margin:12px auto;
    padding:14px;
    width:260px;
    border-radius:10px;
    font-size:20px;
    transition:0.3s;
    box-shadow:0 0 10px #ff3b3b;
}

a:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px #ff3b3b;
}

/* dynie */
.pumpkin{
    position:fixed;
    top:-50px;
    font-size:30px;
    animation:fall linear infinite;
    z-index:1;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="container">

<div id="clock"></div>

</div>

<script>

/* zegar */
function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString();
    document.getElementById("clock").innerHTML = time;
}

setInterval(updateClock,1000);
updateClock();

/* spadające dynie */
function createPumpkin(){
    const pumpkin = document.createElement("div");
    pumpkin.classList.add("pumpkin");
    pumpkin.innerHTML="🎃";

    pumpkin.style.left=Math.random()*100+"vw";
    pumpkin.style.animationDuration=(3+Math.random()*5)+"s";

    document.body.appendChild(pumpkin);

    setTimeout(()=>{
        pumpkin.remove();
    },8000);
}

setInterval(createPumpkin,600);

</script>

</body>
