<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025/2026 - Dynamiczna Strona z Automatycznymi Ikonami</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter', sans-serif;
    background: linear-gradient(135deg,#1f1f1f,#2c2c2c);
    margin:0;
    padding:30px;
    color:#f5f5f5;
}
.container{
    max-width:1100px;
    margin:auto;
}
header{
    text-align:center;
    margin-bottom:30px;
}
h1{
    color:#4CAF50;
}
.stats{
    margin-top:10px;
    color:#bdbdbd;
}
.search{
    display:flex;
    justify-content:center;
    margin:25px 0;
}
.search input{
    width:320px;
    padding:10px;
    border-radius:6px;
    border:none;
    background:#333;
    color:white;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
}
.card{
    background:#333;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.4);
    transition:0.25s;
}
.card:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 10px 22px rgba(0,0,0,0.7);
}
.icon{
    font-size:28px;
    margin-bottom:8px;
}
.card a{
    text-decoration:none;
    color:white;
    background:#4CAF50;
    padding:8px 14px;
    border-radius:6px;
    display:inline-block;
    margin-top:10px;
    font-weight:600;
}
.card a:hover{
    background:#43a047;
}
#topBtn{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#4CAF50;
    border:none;
    color:white;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    display:none;
}
footer{
    text-align:center;
    margin-top:30px;
    color:#9e9e9e;
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>JavaScript – materiały</h1>
<div class="stats">Liczba tematów: <span id="count"></span></div>
</header>

<div class="search">
<input type="text" id="searchInput" placeholder="Szukaj tematu...">
</div>

<div class="grid" id="grid"></div>

<footer>
Materiały do nauki JavaScript
</footer>
</div>

<button id="topBtn">↑</button>

<script>
// --- Lista podstron ---
// Wystarczy podać tytuł i link, ikona jest opcjonalna
const pages = [
  {title:"Zadania JS", link:"js.html", icon:"📘"},
  {title:"Operatory", link:"operatory.html"}, // brak ikony → losowa
  {title:"Instrukcje sterujące", link:"warunki.html"},
  {title:"Funkcje", link:"funkcje.html", icon:"⚙️"},
  {title:"Zdarzenia", link:"zdarzenia.html"},
  {title:"Obiekty", link:"obiekt.html"},
  {title:"Funkcje strzałkowe", link:"szczalkowe.html"},
  {title:"DOM", link:"dom.html"},
  {title:"Tabliczka mnożenia", link:"tablica.html"},
  {title:"DOM wersja 2", link:"dom2.html"},
  {title:"Tabela asocjacyjna", link:"asocjacyjna.html"},
  {title:"Powrót", link:"index.html"}
];

// --- Pula emoji dla automatycznych ikon ---
const emojiPool = ["📘","🖱","⚙️","📦","🌐","🆕","🧩","📊","🏠","✖️","🔀","➡️"];

// --- Generowanie kart ---
const grid = document.getElementById("grid");

pages.forEach(p=>{
  const card = document.createElement("div");
  card.className="card";
  const icon = p.icon || emojiPool[Math.floor(Math.random()*emojiPool.length)];
  card.innerHTML=`
    <div class="icon">${icon}</div>
    <h3>${p.title}</h3>
    <a href="${p.link}">Otwórz</a>
  `;
  grid.appendChild(card);
});

// --- Licznik kart ---
document.getElementById("count").textContent = pages.length;

// --- Wyszukiwarka ---
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("keyup",()=>{
  const filter = searchInput.value.toLowerCase();
  const cards = document.querySelectorAll(".card");
  cards.forEach(card=>{
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(filter) ? "block" : "none";
  });
});

// --- Przycisk powrotu do góry ---
const topBtn = document.getElementById("topBtn");
window.onscroll = function(){
  topBtn.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
};
topBtn.onclick = function(){
  window.scrollTo({top:0,behavior:"smooth"});
};
</script>

</body>
</html>
