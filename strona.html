<!DOCTYPE html>
<html lang="pl-PL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacja paliw</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: white;
      color: #333;
    }

    header, footer {
      background-color: red;
      color: white;
      text-align: center;
      padding: 20px;
    }

    nav {
      background-color: black;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: yellow;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    #lewy, #prawy {
      flex: 1;
      min-width: 300px;
      padding: 20px;
      border-radius: 10px;
    }

    #lewy {
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    #prawy {
      background-color: red;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .auto {
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: black;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
      border-radius: 5px;
    }

    button:hover {
      background-color: green;
    }

    #wynik, #podsumowanie {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>
  <h1>Całodobowa stacja paliw</h1>
</header>

<nav>
  <a href="index.html">Powrót</a>
</nav>

<main>

  <section id="lewy">

    <h2>Orientacyjny koszt paliwa</h2>

    <p>
      95 - 6.80 zł/l <br>
      ON - 7.30 zł/l
    </p>

    <!-- SAMOCHÓD 1 -->
    <div class="auto">
      <h2>Samochód 1</h2>

      <label>Rodzaj paliwa:</label>
      <input type="number" id="rodzaj1" min="1" max="2">

      <label>Ilość litrów:</label>
      <input type="number" id="ilosc1">

      <label>Marka:</label>
      <select id="marka1">
        <option value="Lamborghini">Lamborghini</option>
        <option value="Audi">Audi</option>
        <option value="BMW">BMW</option>
        <option value="Porsche">Porsche</option>
        <option value="Toyota">Toyota</option>
      </select>
    </div>

    <!-- SAMOCHÓD 2 -->
    <div class="auto">
      <h2>Samochód 2</h2>

      <label>Rodzaj paliwa:</label>
      <input type="number" id="rodzaj2" min="1" max="2">

      <label>Ilość litrów:</label>
      <input type="number" id="ilosc2">

      <label>Marka:</label>
      <select id="marka2">
        <option value="Lamborghini">Lamborghini</option>
        <option value="Audi">Audi</option>
        <option value="BMW">BMW</option>
        <option value="Porsche">Porsche</option>
        <option value="Toyota">Toyota</option>
      </select>
    </div>

    <button onclick="oblicz()">OBLICZ</button>

    <p id="wynik"></p>
    <p id="podsumowanie"></p>

  </section>

  <section id="prawy">
    <img id="samochod" src="lamborghini.png" alt="Samochód">
  </section>

</main>

<footer>
  <p>Stacja paliw - całodobowa obsługa!</p>
</footer>

<script>

function policzKoszt(rodzaj, ilosc) {

  let cena = 0;

  if (rodzaj == 1) {
    cena = 6.80;
  }
  else if (rodzaj == 2) {
    cena = 7.30;
  }

  return {
    koszt: ilosc * cena,
    cena: cena
  };
}

function oblicz() {

  // AUTO 1
  let rodzaj1 = document.getElementById("rodzaj1").value;
  let ilosc1 = document.getElementById("ilosc1").value;
  let marka1 = document.getElementById("marka1").value;

  // AUTO 2
  let rodzaj2 = document.getElementById("rodzaj2").value;
  let ilosc2 = document.getElementById("ilosc2").value;
  let marka2 = document.getElementById("marka2").value;

  let auto1 = policzKoszt(rodzaj1, ilosc1);
  let auto2 = policzKoszt(rodzaj2, ilosc2);

  let suma = auto1.koszt + auto2.koszt;

  document.getElementById("wynik").innerHTML =
    "<b>Łączny koszt:</b> " + suma.toFixed(2) + " zł";

  document.getElementById("podsumowanie").innerHTML =

    "<h3>Samochód 1</h3>" +
    "Marka: " + marka1 + "<br>" +
    "Koszt: " + auto1.koszt.toFixed(2) + " zł<br><br>" +

    "<h3>Samochód 2</h3>" +
    "Marka: " + marka2 + "<br>" +
    "Koszt: " + auto2.koszt.toFixed(2) + " zł";
}

</script>

</body>
</html>
