<!DOCTYPE html>
<html lang="pl-PL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacja paliw</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:white;
      color:#333;
    }

    header,footer{
      background:red;
      color:white;
      text-align:center;
      padding:20px;
    }

    nav{
      background:black;
      display:flex;
      justify-content:center;
      gap:20px;
      padding:15px;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    nav a:hover{
      color:yellow;
    }

    main{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      padding:20px;
    }

    #lewy,#prawy{
      flex:1;
      min-width:300px;
      padding:20px;
      border-radius:10px;
    }

    #lewy{
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    #prawy{
      background:red;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    img{
      max-width:100%;
      border-radius:10px;
    }

    .auto{
      border:2px solid #ddd;
      border-radius:10px;
      padding:15px;
      margin-bottom:20px;
    }

    h2{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-top:10px;
    }

    input,select{
      width:100%;
      padding:10px;
      margin-top:5px;
    }

    button{
      margin-top:20px;
      padding:12px 20px;
      background:black;
      color:white;
      border:none;
      cursor:pointer;
      font-size:18px;
      border-radius:5px;
      margin-right:10px;
    }

    button:hover{
      background:green;
    }

    .usun{
      background:darkred;
    }

    .usun:hover{
      background:red;
    }

    #wynik,#podsumowanie{
      margin-top:20px;
      font-size:18px;
    }

  </style>
</head>

<body>

<header>
  <h1>Całodobowa stacja paliw</h1>
</header>

<nav>
  <a href="index.html">Powrót</a>
</nav>

<main>

  <section id="lewy">

    <h2>Orientacyjny koszt</h2>

    <p>
      95 - 6.80 zł/l <br>
      ON - 7.30 zł/l <br>
      Prąd - 1.89 zł/kWh
    </p>

    <div id="auta"></div>

    <button onclick="dodajAuto()">+ Dodaj samochód</button>
    <button onclick="oblicz()">OBLICZ</button>

    <p id="wynik"></p>
    <div id="podsumowanie"></div>

  </section>

  <section id="prawy">
    <img id="samochod" src="lamborghini.png" alt="Samochód">
  </section>

</main>

<footer>
  <p>Stacja paliw - całodobowa obsługa!</p>
</footer>

<script>

let licznikAut = 0;

function dodajAuto(){

  licznikAut++;

  let kontener = document.getElementById("auta");

  let div = document.createElement("div");
  div.className = "auto";
  div.id = "auto" + licznikAut;

  div.innerHTML = `

    <h2>Samochód ${licznikAut}</h2>

    <label>Rodzaj paliwa:</label>
    <select id="rodzaj${licznikAut}">
      <option value="1">95</option>
      <option value="2">ON</option>
      <option value="3">Elektryk</option>
    </select>

    <label>Ilość:</label>
    <input type="number" id="ilosc${licznikAut}" placeholder="Litry lub kWh">

    <label>Marka:</label>
    <select id="marka${licznikAut}">
      <option>Lamborghini</option>
      <option>Audi</option>
      <option>BMW</option>
      <option>Porsche</option>
      <option>Toyota</option>
    
    </select>

    <button class="usun" onclick="usunAuto(${licznikAut})">
      Usuń
    </button>

  `;

  kontener.appendChild(div);

  podlaczZmianeObrazka(licznikAut);
}

function podlaczZmianeObrazka(id){

  let select = document.getElementById("marka" + id);

  select.addEventListener("change", function(){

    zmienObraz(this.value);

  });
}

function zmienObraz(marka){

  let img = document.getElementById("samochod");

  let mapa = {
    Lamborghini: "lamborghini.png",
    Audi: "audi.png",
    BMW: "bmw.png",
    Porsche: "porsche.png",
    Toyota: "toyota.png",
 
  
  };

  img.src = mapa[marka] || "lamborghini.png";
}

function usunAuto(id){

  let auto = document.getElementById("auto" + id);

  if(auto){
    auto.remove();
  }

  odswiezNumeracje();
}

function odswiezNumeracje(){

  let auta = document.querySelectorAll("#auta .auto");

  let numer = 1;

  auta.forEach(auto => {

    auto.id = "auto" + numer;

    auto.querySelector("h2").innerHTML =
      "Samochód " + numer;

    auto.querySelector("select[id^='rodzaj']").id = "rodzaj" + numer;
    auto.querySelector("input[id^='ilosc']").id = "ilosc" + numer;

    let marka = auto.querySelector("select[id^='marka']");
    marka.id = "marka" + numer;

    auto.querySelector(".usun").setAttribute(
      "onclick",
      "usunAuto(" + numer + ")"
    );

    // naprawiamy event listener po renumeracji
    podlaczZmianeObrazka(numer);

    numer++;
  });

  licznikAut = auta.length;
}

function policzKoszt(rodzaj,ilosc){

  let cena = 0;
  let typ = "";

  if(rodzaj == 1){
    cena = 6.80;
    typ = "95";
  }
  else if(rodzaj == 2){
    cena = 7.30;
    typ = "ON";
  }
  else if(rodzaj == 3){
    cena = 1.89;
    typ = "Prąd";
  }

  return {
    koszt: ilosc * cena,
    cena: cena,
    typ: typ
  };
}

function oblicz(){

  let suma = 0;
  let podsumowanie = "";

  for(let i=1;i<=licznikAut;i++){

    let auto = document.getElementById("auto" + i);
    if(!auto) continue;

    let rodzaj = document.getElementById("rodzaj" + i).value;
    let ilosc = document.getElementById("ilosc" + i).value;
    let marka = document.getElementById("marka" + i).value;

    let dane = policzKoszt(rodzaj,ilosc);

    suma += dane.koszt;

    podsumowanie += `
      <div class="auto">
        <h3>Samochód ${i}</h3>
        Marka: ${marka}<br>
        Rodzaj: ${dane.typ}<br>
        Ilość: ${ilosc}<br>
        Koszt: ${dane.koszt.toFixed(2)} zł
      </div>
    `;
  }

  document.getElementById("wynik").innerHTML =
    "<b>Łączny koszt:</b> " + suma.toFixed(2) + " zł";

  document.getElementById("podsumowanie").innerHTML = podsumowanie;
}

// start
dodajAuto();
dodajAuto();

</script>

</body>
</html>
