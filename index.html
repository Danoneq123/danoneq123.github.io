<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<link rel="icon" type="image/x-icon" href="apple.gif">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: "Lato", sans-serif;
    background:url("cyberpunk-pixel-city-neon-2bagugxcfp2to7tx.gif") no-repeat center center fixed;
    background-size:cover;
}

/* panel */
.container{
    background: rgba(0,0,0,0.75);
    padding:60px;
    border-radius:20px;
    text-align:center;
    backdrop-filter: blur(8px);
    box-shadow:0 0 30px rgba(0,0,0,0.7);
}

/* przyciski */
a{
    display:block;
    text-decoration:none;
    color:white;
    background:#9b59ff;
    margin:20px auto;
    padding:18px;
    width:260px;
    border-radius:12px;
    font-size:22px;
    transition:0.3s;
    box-shadow:0 0 10px #9b59ff;
    animation:fadeIn 1s ease;
}

/* efekt hover */
a:hover{
    background:#6d2de2;
    transform:scale(1.08);
    box-shadow:0 0 25px #9b59ff;
}

/* zegar */
#clock{
    color:white;
    font-size:28px;
    margin-bottom:30px;
    letter-spacing:3px;
}

/* animacja */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

<div id="clock"></div>

<a href="strona2.html">STRONA Z JS</a>
<a href="gra.html">GRA</a>
<a href="strona.html">ZADANIE EGZAMIN</a>

</div>

<script>

/* zegar */
function updateClock(){
    const now = new Date();
    const time = now.toLocaleTimeString();
    document.getElementById("clock").innerHTML = time;
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
