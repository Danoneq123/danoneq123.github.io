<?php
session_start();


if (isset($_SESSION['user'])) {
    header("Location: panel.html");
    exit();
}

$error = "";

if ($_SERVER["REQUEST_METHOD"] == "POST") {
    $login = $_POST["login"];
    $haslo = $_POST["haslo"];

   
    if ($login === "admin" && $haslo === "1234") {
        $_SESSION["user"] = $login;
        header("Location: panel.html");
        exit();
    } else {
        $error = "Zły login lub hasło!";
    }
}
?>
