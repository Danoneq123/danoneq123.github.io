<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tablica asocjacyjna</title>
<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
table{
    border-collapse:collapse;
}
th, td{
    border:1px solid black;
    padding:10px 20px;
    text-align:center;
}
</style>
</head>
<body>

<table id="tabela">
<tr>
<th>Imię</th>
<th>Wiek</th>
<th>Miasto</th>
</tr>
</table>

<script>
const osoby = {
  jan: { imie: "Jan", wiek: 25, miasto: "Warszawa" },
  anna: { imie: "Anna", wiek: 30, miasto: "Kraków" },
  piotr: { imie: "Piotr", wiek: 22, miasto: "Gdańsk" },
  kasia: { imie: "Kasia", wiek: 28, miasto: "Wrocław" }
};

const tabela = document.getElementById("tabela");

for (let k in osoby) {
  const wiersz = tabela.insertRow();
  wiersz.insertCell().innerText = osoby[k].imie;
  wiersz.insertCell().innerText = osoby[k].wiek;
  wiersz.insertCell().innerText = osoby[k].miasto;
}
</script>

</body>
</html>
