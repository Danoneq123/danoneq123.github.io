<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tablica asocjacyjna JS</title>
</head>
<body>

<h1>Tablica asocjacyjna</h1>
<div id="wynik"></div>

<script>
const osoby = {
  jan: { imie: "Jan", wiek: 25, miasto: "Warszawa" },
  anna: { imie: "Anna", wiek: 30, miasto: "Kraków" },
  piotr: { imie: "Piotr", wiek: 22, miasto: "Gdańsk" }
};

osoby.kasia = { imie: "Kasia", wiek: 28, miasto: "Wrocław" };

let tekst = "";

for (let k in osoby) {
  tekst += osoby[k].imie + " " + osoby[k].wiek + " " + osoby[k].miasto + "<br>";
}

document.getElementById("wynik").innerHTML = tekst;
</script>

</body>
</html>
