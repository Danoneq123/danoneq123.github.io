<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Bloki DOM z tablicą</title>

<style>
body{
  font-family: Arial;
  text-align: center;
  margin-top: 40px;
}

#container{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:20px;
}

.box{
  padding:10px 15px;
  border:1px solid #ccc;
  border-radius:6px;
  display:flex;
  gap:10px;
  align-items:center;
  cursor:grab;
}

.box:active{
  cursor:grabbing;
}

button{
  padding:8px 12px;
  cursor:pointer;
}
</style>
</head>
<body>

<h2>Bloki</h2>
<button id="addBtn">Dodaj blok</button>
<div id="container"></div>

<script>
const container = document.getElementById("container");
const addBtn = document.getElementById("addBtn");

let counter = 1;
let draggedIndex = null;

// tablica przechowująca wszystkie bloki
let boxesArray = [];

// funkcja losowego koloru
function randomColor(){
  return `hsl(${Math.random()*360},70%,75%)`;
}

// aktualizacja DOM na podstawie tablicy
function render(){
  container.innerHTML = "";
  boxesArray.forEach((box, index) => {
    const div = document.createElement("div");
    div.className = "box";
    div.draggable = true;
    div.style.backgroundColor = box.color;

    const span = document.createElement("span");
    span.textContent = box.text;

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edytuj";
    editBtn.onclick = () => {
      const newText = prompt("Nowy tekst:", span.textContent);
      if(newText) {
        boxesArray[index].text = newText;
        render();
      }
    };

    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Usuń";
    removeBtn.onclick = () => {
      boxesArray.splice(index, 1);
      render();
    };

    div.append(span, editBtn, removeBtn);

    // przeciąganie
    div.addEventListener("dragstart", () => {
      draggedIndex = index;
      div.style.opacity = "0.5";
    });

    div.addEventListener("dragend", () => {
      div.style.opacity = "1";
    });

    div.addEventListener("dragover", (e) => e.preventDefault());

    div.addEventListener("drop", () => {
      if (draggedIndex !== null && draggedIndex !== index) {
        const [moved] = boxesArray.splice(draggedIndex, 1);
        boxesArray.splice(index, 0, moved);
        draggedIndex = null;
        render();
      }
    });

    container.appendChild(div);
  });
}

// dodawanie nowego bloku
addBtn.onclick = () => {
  boxesArray.push({
    text: "Blok " + counter++,
    color: randomColor()
  });
  render();
};

</script>
</body>
</html>
